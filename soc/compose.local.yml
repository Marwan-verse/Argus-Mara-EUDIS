name: argus-soc-local
services:
  relay:
    build:
      context: ..
      dockerfile: soc/Dockerfile
    environment:
      ARGUS_SOC_ORIGIN: https://localhost:8443
      ARGUS_SOC_DB: /data/accounts.sqlite3
      ARGUS_SOC_PROXY_NETWORK: 172.30.66.0/24
      ARGUS_SOC_LOCAL_DEMO: "1"
    volumes:
      - local_accounts:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    networks: [local_private]
  seed:
    profiles: [setup]
    extends:
      service: relay
    env_file:
      - ../data/soc-local/demo.env
    restart: "no"
    command: [python, -m, argus.collab_server, --seed-demo]
  https:
    image: caddy:2.11.3-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - local_certificates:/data
      - local_caddy_config:/config
    restart: unless-stopped
    networks: [local_private]
networks:
  local_private:
    ipam:
      config:
        - subnet: 172.30.66.0/24
volumes:
  local_accounts:
  local_certificates:
  local_caddy_config:
