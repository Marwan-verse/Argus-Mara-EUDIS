name: Validate demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install desktop and optional live test dependencies
        run: python -m pip install -r requirements.txt -r live/requirements.txt -r soc/requirements.txt
      - name: Install optional satellite readers
        if: matrix.python-version == '3.12'
        run: python -m pip install -r requirements-satellite.txt -r recorder/requirements.txt
      - name: Check demo contract
        run: python scripts/check_contracts.py
      - name: Check public source for credential patterns
        run: python scripts/check_public_release.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser state and replay
        run: |
          node tests/test_replay.mjs
          node --test tests/test_live_browser.mjs
